<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalles del producto</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <main>
        <section class="product">
            <img src="../assets/images/patito-amarillo.png" alt="Patito amarillo">
            <div class="product__content">
                <h1 class="product-content__tittle">Patito de Goma Amarillo</h1>
                <h2 class="product-content__price">24.00€</h2>
                <img class="product-content__image" src="../assets/images/stock-advise.png" alt="En stock">
                <h3 class="product-content__description-tittle">DESCRIPCIÓN</h3>
                <p class="product-content__description">Un icono del diseño contemporáneo. Este patito ha
                    sido esculpido con precisión geométrica para ofrecer una
                    experiencia estética única en cualquier entorno acuático.</p>
                <div class="product-content__details">
                    <ul class="product-content-details__list">
                        <li>
                            <span class="details-list__label">Medidas</span>
                            <span class="details-list__value">10 x 8 cm</span>
                        </li>
                        <li>
                            <span class="details-list__label">Materiales</span>
                            <span class="details-list__value">Vinilo Premium</span>
                        </li>
                        <li>git 
                            <span class="details-list__label">Peso</span>
                            <span class="details-list__value">150g</span>
                        </li>
                    </ul>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
