<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de compra</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <script type="module" src="/src/js/duckstoreApp.js" defer></script>
</head>

<body>
    <header>
        <ul class="header__navigation-bar">
            <li class="navigation-bar__link"><a href="/index.html" class="logo-link"><img
                        src="/src/assets/images/logo-redondo.png"
                        alt="círculo con fondo negro y sólo líneas amarillas dibujando un círculo y dentro la silueta de un pato"
                        class="logo"></a></li>
            <li class="navigation-bar__link"><a href="/src/pages/catalogo.html" class="internal-link">Catálogo</a></li>
            <li class="navigation-bar__link"><a href="/src/pages/contacto.html" class="internal-link">Contacto</a></li>
            <li class="navigation-bar__link"><a href="/src/pages/carrito.html" class="internal-link"
                    id="LogoCarrito"><img src="/src/assets/icons/icons-carrito.png" alt="Carrito de compras"></a></li>
        </ul>
    </header>
    <main class="carrito">
        <div class="carrito__header">
            <h1 class="header__title">Tu Carrito</h1>
            <p class="header__subtitle">Piezas exclusivas seleccionadas para tu colección.
                La elegancia flotante en cada detalle.</p>
        </div>
        <section class="carrito__subtotal">
            <div id="subtotal__ducks" class="carrito-subtotal__ducks">

            </div>
            <div class="carrito-subtotal__price">
                <p class="subtotal__title">Resumen</p>
                <ul id="subtotal__prices">
                    
                </ul>
                <p class="subtotal__total">Total:<span id="total__price" class="total__price"></span></p>
                <button class="subtotal__buy"><a id="finish__buy" href="/src/pages/pago.html">Finalizar Compra</a></button>
                <p class="subtotal__secure">Pagos seguros procesados por DuckPay</p>
                <a class="subtotal__return" href="/src/pages/catalogo.html">Seguir comprando</a>
            </div>
        </section>
    </main>
    <footer>
        <div class="footer__links">
            <a href="https://www.facebook.com/" target="__blank" class="footer__icon-link"><img
                    src="/src/assets/icons/icons-facebook-50.png" alt="icono de facebook cuadrado"
                    class="socialnet-icon"></a>
            <a href="https://www.instagram.com/" target="__blank" class="footer__icon-link"><img
                    src="/src/assets/icons/icons-instagram-50.png" alt="icono de instagram cuadrado"
                    class="socialnet-icon"></a>
            <a href="https://es.linkedin.com/" target="__blank" class="footer__icon-link"><img
                    src="/src/assets/icons/icons-linkedin-50.png" alt="icono de linkedin cuadrado"
                    class="socialnet-icon"></a>
        </div>
        <p class="footer__copyright">@2024 DUCKSTORE. SOPHISTICATED PLAY.</p>
    </footer>
</body>

</html>
